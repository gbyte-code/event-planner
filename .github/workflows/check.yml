name: Project Check

on:
  push:
  pull_request:

jobs:
  check-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f tasks.txt
          test -f schedule.txt
          test -f .gitignore
          echo "All required files exist."